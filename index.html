<html>
  <head>
  <meta charset="UTF-8">
  <meta name="description" content="Contador de puntajes para el juego René">
  <meta name="keywords" content="Cartas, apuestas, puntaje, ganadores">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/7/73/Frans_Hals_-_Portret_van_Ren%C3%A9_Descartes.jpg?size=1024">
  <title>Contador de René</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body class="dark-mode">
  <div id="welcomeScreen">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Frans_Hals_-_Portret_van_Ren%C3%A9_Descartes.jpg" alt="René Descartes">
    <div class="welcome-info">
      <h1>Bienvenidos al<br><b>Contador de René</b></h1>
      <button class="large" onclick="continueFromWelcome()">Continuar</button>
    </div>
  </div>

  <div id="playersModal" class="modal">
    <div class="players-modal-wrapper">
      <div class="mode-tabs-container">
        <button id="tabClassicMode" class="mode-tab-btn active" onclick="setPlayerMode('classic')">Modo Clásico</button>
        <button id="tabAriMode" class="mode-tab-btn" onclick="setPlayerMode('ari')">Modo Ari</button>
      </div>
      <div class="modal-content">
        <h2>Jugadores:</h2>
        <div id="playerButtons">
          <button onclick="selectPlayer('Fer'); disabled = true;">Fer</button>
          <button onclick="selectPlayer('Ari'); disabled = true;">Ari</button>
          <button onclick="selectPlayer('Laro'); disabled = true;">Laro</button>
          <button onclick="selectPlayer('Juryk'); disabled = true;">Juryk</button>
          <button onclick="selectPlayer('Lina'); disabled = true;">Lina</button>
          <button onclick="selectPlayer('Fede'); disabled = true;">Fede</button>
          <button onclick="selectPlayer('Alitan'); disabled = true;">Alitan</button>
          <button onclick="showCustomPlayerInput()">Otro</button>
        </div>
        <div id="customPlayerInput" class="hidden">
          <input type="text" id="customPlayerName" placeholder="Nombre del jugador">
          <button onclick="addCustomPlayer()">Agregar</button>
        </div>
        <h3>Jugadores seleccionados:</h3>
        <div id="selectedPlayers"></div>
        <button onclick="confirmPlayers()">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="roundsModal" class="modal">
    <div class="modal-content">
      <h2>¿A cuánto se va a jugar?</h2>
      <button onclick="selectRounds(5)">5</button>
      <button onclick="selectRounds(6)">6</button>
      <button onclick="selectRounds(7)">7</button>
      <button onclick="selectRounds(8)">8</button>
    </div>
  </div>

  <div id="mainTableContainer" class="hidden">
    <table>
      <thead>
        <tr id="playersHeader"></tr>
      </thead>
      <tbody id="gameRounds"></tbody>
    </table>
  </div>
  <div class="flex">
    <button id="correctButton" class="hidden" onclick="showCorrectionModal()">Corregir</button>
    <button id="resetButton" class="hidden" onclick="resetGame()">Reiniciar</button>
  </div>
  <div id="bettingModal" class="modal">
    <div class="modal-content">
      <button id="betBackButton" class="back-arrow-btn hidden" title="Volver al jugador anterior" aria-label="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div id="bettingHeader" style="border-bottom: 1px solid #464646; padding-bottom: 10px; margin-bottom: 20px;">
        <h3 style="margin-top: 0;">A quién hay que bajar:</h3>
        <div id="bettingLeaderboard" style="font-size: 14px; text-align: left; display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 5px;">
          <!-- Leaderboard dinámico -->
        </div>
      </div>
      <div id="bettingContent">
        <!-- Contenido dinámico -->
      </div>
    </div>
  </div>

  <div id="resultsModal" class="modal">
    <div class="modal-content">
      <button id="resultsBackButton" class="back-arrow-btn hidden" title="Volver a seleccionar perdedores" aria-label="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div id="resultsContent">
        <!-- Contenido dinámico -->
      </div>
    </div>
  </div>

  <div id="correctionModal" class="modal">
    <div class="modal-content">
      <h2>Corregir Puntaje</h2>
      <div class="flex">
        <select id="correctionPlayerSelect">
          <!-- Opciones generadas dinámicamente -->
        </select>
        <input id="correctionPoints" placeholder="Puntos">
      </div>
      <div class="flex">
        <button onclick="applyCorrection()">Aplicar</button>
        <button onclick="closeCorrectionModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="dealerWarningModal" class="modal">
    <div class="modal-content">
      <h2 id="dealerWarningText" style="font-size: 1.2em; margin-bottom: 20px;"></h2>
      <div id="dealerWarningButtons" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"></div>
    </div>
  </div>

  <div id="podiumModal" class="modal">
    <div class="modal-content">
      <h2>Podio</h2>
      <div id="podiumContent">
        <!-- Contenido del podio dinámico -->
      </div>
      <button onclick="closePodiumModal()">Cerrar</button>
    </div>
  </div>

  <div id="customDialogModal" class="modal custom-dialog-modal">
    <div class="modal-content custom-dialog-content">
      <div id="customDialogIcon" class="custom-dialog-icon">⚠️</div>
      <h3 id="customDialogTitle" class="custom-dialog-title">Atención</h3>
      <p id="customDialogMessage" class="custom-dialog-message"></p>
      <div id="customDialogActions" class="custom-dialog-actions"></div>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script src="index.js"></script>
</body>
</html>
